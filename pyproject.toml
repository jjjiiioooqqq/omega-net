[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "engint"
version = "0.1.0"
description = "Evidence-bound engineering contradiction elimination and mocap-less scene extraction foundation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "sympy>=1.12",
  "z3-solver>=4.12",
  "numpy>=1.26",
  "scipy>=1.11",
  "networkx>=3.2",
]

[project.optional-dependencies]
mocap = [
  "opencv-python>=4.9",
  "mediapipe>=0.10.14",
  "torch>=2.2",
  "torchvision>=0.17",
  "segment-anything @ git+https://github.com/facebookresearch/segment-anything.git",
]
dev = [
  "pytest>=8.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
