[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-intelligence"
version = "0.1.0"
description = "Evidence-bound engineering contradiction-elimination and design-closure foundation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "sympy>=1.12",
  "z3-solver>=4.12",
  "networkx>=3.2",
  "numpy>=1.26",
  "scipy>=1.11"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
